name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e . --no-deps
      - name: Tests (unit, contracts, drift, golden, SQL on DuckDB, planted defects)
        run: pytest -q
      - name: Every example in the repository passes its own syntax rules
        run: python engine/repo_check.py
      - name: The tables in the docs match the code
        run: python -m engine.docs_gen --check
      - name: Schemas in schemas/ match the Pydantic contracts
        run: |
          python engine/contracts.py --write-schemas > /dev/null
          git diff --exit-code schemas/
      - name: The install works as the README says
        run: |
          lcm --version
          LCM_WORKSPACE=examples/brands/northfield_dtc lcm doctor
          lcm init "$RUNNER_TEMP/acme" --name Acme --platform klaviyo
          LCM_WORKSPACE="$RUNNER_TEMP/acme" lcm doctor
      - name: Both demo workspaces' data pass check-data, and the Northfield import reproduces its data
        run: |
          lcm check-data examples/brands/ridgeview_saas/data > /dev/null
          lcm check-data examples/brands/northfield_dtc/data > /dev/null
          lcm import auto examples/brands/northfield_dtc/exports --out "$RUNNER_TEMP/nf_data" > /dev/null
          for f in examples/brands/northfield_dtc/data/*.csv; do cmp "$f" "$RUNNER_TEMP/nf_data/$(basename "$f")"; done
      - name: Worked examples reproduce
        run: |
          lcm deliverability analyze examples/deliverability/healthy.json --markdown > /dev/null
          lcm readout examples/stats/winback_readout.json > /dev/null
          lcm lint --dialect customerio --email templates/email/components.html > /dev/null
          lcm size --baseline 0.1 --mde-rel 0.2 --holdout 0.15 --entries-per-month 2000
      - name: Both demo brands plan offline, and each plan passes its own simulation
        run: |
          LCM_WORKSPACE=examples/brands/ridgeview_saas lcm plan --brief examples/brands/ridgeview_saas/briefs/winback_14d.yaml --data examples/brands/ridgeview_saas/data --copy-mode offline --out out
          lcm simulate out/ridgeview_winback_14d/flow_spec.json
          LCM_WORKSPACE=examples/brands/northfield_dtc lcm plan --text "a 3-touch abandoned cart flow with email and SMS" --data examples/brands/northfield_dtc/data --copy-mode offline --out out
          for f in examples/flows/*.json; do lcm simulate "$f" > /dev/null; done
      - name: A saved run can be revised by sentence and inspected
        run: |
          LCM_WORKSPACE=examples/brands/ridgeview_saas lcm "make it 4 touches" --run out/ridgeview_winback_14d > /dev/null
          lcm status --run out/ridgeview_winback_14d
      - name: Workflows and the daily job run on the demo data with no step errors
        run: |
          LCM_WORKSPACE=examples/brands/northfield_dtc lcm workflow run morning_check --out out || [ $? -eq 1 ]
          python engine/workflows/daily.py --dry-run --strict --out out/daily > /dev/null
          python -c "import json; s = json.load(open('out/daily/status.json')); assert s['flows'] and not s['errors'], s"
      - name: The plain-English front door routes and runs
        run: |
          lcm --dry-run "check deliverability for example.com"
          lcm "how many people do we need to detect a 20% lift on a 10% baseline with a 15% holdout"
          lcm "build the engagement tiers and the sunset list" --data examples/brands/ridgeview_saas/data --platform braze --out out > /dev/null
          lcm "compare our monthly newsletter with the win-back trigger" --brief examples/brands/ridgeview_saas/briefs/winback_14d.yaml --data examples/brands/ridgeview_saas/data --out out > /dev/null
          python engine/questions.py
          lcm "what are my top 3 priority builds today and why?" --data examples/brands/ridgeview_saas/data --out out > /dev/null

  install-with-uv:
    # The README's install block, run as written on a clean machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run lcm doctor
      - name: The QUICKSTART's sample-brand steps, as written
        working-directory: examples/brands/northfield_dtc
        run: |
          uv run lcm plan --text "a 3-touch abandoned cart flow with email and SMS" --data data --copy-mode offline
          uv run lcm "make it 4 touches"
          uv run lcm simulate --program
          uv run lcm size --baseline 0.31 --mde-rel 0.15 --holdout 0.10 --entries-per-month 350
          uv run lcm workflow run morning_check || [ $? -eq 1 ]

  postgres:
    # Runs the PostgreSQL-dialect cohort queries on a real PostgreSQL and compares them with DuckDB.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LCM_PG: "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/sql/test_postgres.py
