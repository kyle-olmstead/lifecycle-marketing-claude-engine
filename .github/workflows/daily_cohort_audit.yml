# Daily lifecycle health check at 05:00 UTC.
#
# Runs scripts/daily.py: a cohort audit for every brief in briefs/active/, engagement tiers from the
# ESP's message events, and a live DNS check of each sending domain. The summary goes to the run
# page, every result to a Google Sheet, and each finding to its own GitHub issue (one per flow with
# an anomaly, per RED domain, and for a RED unengaged share), commented on again while it stays open.
# Configure it in the repository's Settings, Secrets and variables, Actions. With nothing configured
# it runs on the demo fixtures, so the workflow stays green and shows what the output looks like.
#
# Variables (vars.*)
#   LCM_BQ_PROJECT, LCM_BQ_DATASET  BigQuery mode: the audit and tier SQL run in your warehouse; the dataset
#                                   holds users, orders, track_events and message_events (or views with those names)
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#                                   keyless auth to Google Cloud for BigQuery mode (Workload Identity Federation)
#   LCM_DATA_URL                    file mode instead: an https URL prefix serving the tables as .parquet or .csv
#   LCM_DOMAINS                     comma-separated sending domains to check (for example example.com,em.example.com)
#   LCM_SHEET_ID                    the Google Sheet to log to
#   LCM_FAIL_ON_ANOMALY             'true' to fail the run when any flow has an anomaly
# Secrets (secrets.*)
#   GOOGLE_SERVICE_ACCOUNT_JSON     service-account key with Editor access to the sheet
#
# Scheduled workflows in a public repository pause after 60 days without repository activity;
# GitHub emails the owner, and one click re-enables them. GitHub may start a scheduled run some
# minutes late at busy times; the audit judges the latest complete day, so a late start changes nothing.

name: daily cohort audit

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      domains:
        description: "Sending domains to check (comma-separated; default vars.LCM_DOMAINS)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: daily-cohort-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LCM_BQ_PROJECT: ${{ vars.LCM_BQ_PROJECT }}
      LCM_BQ_DATASET: ${{ vars.LCM_BQ_DATASET }}
      LCM_DATA_URL: ${{ vars.LCM_DATA_URL }}
      LCM_DOMAINS: ${{ inputs.domains || vars.LCM_DOMAINS }}
      LCM_SHEET_ID: ${{ vars.LCM_SHEET_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choose the data source
        run: |
          if [ -n "$LCM_BQ_PROJECT" ]; then echo "LCM_MODE=bigquery" >> "$GITHUB_ENV"
          elif [ -n "$LCM_DATA_URL" ]; then echo "LCM_MODE=url" >> "$GITHUB_ENV"
          else echo "LCM_MODE=demo" >> "$GITHUB_ENV"; fi

      - name: Authenticate to Google Cloud
        if: env.LCM_MODE == 'bigquery'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up the bq command line
        if: env.LCM_MODE == 'bigquery'
        uses: google-github-actions/setup-gcloud@v3

      - name: Run the daily health check
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/daily.py --mode "$LCM_MODE" --out out/daily
          cat out/daily/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update one issue per finding
        if: env.LCM_MODE != 'demo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -c '.[]' out/daily/issues.json | while read -r item; do
            TITLE=$(jq -r '.title' <<< "$item")
            LABEL=$(jq -r '.label' <<< "$item")
            { echo "Daily check $(date -u +%F) ([run]($RUN_URL))"; echo; cat "$(jq -r '.body_path' <<< "$item")"; } > body.md
            gh label create "$LABEL" --color B60205 --description "Daily lifecycle health finding" --force
            NUMBER=$(gh issue list --label "$LABEL" --state open --limit 200 --json number,title \
                     | jq -r --arg t "$TITLE" 'map(select(.title == $t))[0].number // empty')
            if [ -n "$NUMBER" ]; then gh issue comment "$NUMBER" --body-file body.md
            else gh issue create --title "$TITLE" --label "$LABEL" --body-file body.md; fi
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: daily-health-${{ github.run_id }}
          path: out/daily
          retention-days: 30

      - name: Fail on step errors, or on anomalies when asked
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          s = json.load(open("out/daily/status.json"))
          for e in s["errors"]:
              print(f"::error::{e}")
          anomalies = [f["flow"] for f in s["flows"] if f.get("status") == "anomaly"]
          if anomalies and os.environ.get("FAIL_ON_ANOMALY") == "true":
              print(f"::error::cohort anomaly in {', '.join(anomalies)}; see the run summary")
              sys.exit(1)
          sys.exit(1 if s["errors"] else 0)
          PY
        env:
          FAIL_ON_ANOMALY: ${{ vars.LCM_FAIL_ON_ANOMALY }}
