# Worked example for a fictional company (Ridgeview, B2B reporting software; see
# examples/context/ridgeview_context.xml). Runs against the DuckDB fixtures in tests/fixtures:
#   python3 -m agents.orchestrator plan --brief briefs/examples/winback_14d.yaml --data tests/fixtures
product_name: Ridgeview
flow_type: winback
goal: >-
  Build a 5-touch automated win-back flow for users who completed onboarding but haven't
  created a report in 14 days
platform: customerio
business_model: subscription
qualifying_event:
  event: onboarding_step_completed
  where: {step_index: 3}
  label: completed onboarding
core_conversion_event:
  event: feature_used
  where: {feature: reports}
  label: created a report
churn_threshold_days: 14
touches: 5
channels: [email, in_app]
holdout_pct: 15
min_detectable_lift: 0.25
sending_gate: GREEN
offer_policy: no discounts or offers
frequency_cap_per_week: 3
send_hour_local: 10
sender_name: Dana Ortiz at Ridgeview
postal_address: 100 Example Way, Suite 400, Springfield, OR 97477
brand_voice: plain, specific, second person, no exclamation marks; operations vocabulary (reports, data sources, teammates)
copy_variants: 2
warehouse_dialect: postgres
cta_url: https://app.ridgeview.example/reports/new
